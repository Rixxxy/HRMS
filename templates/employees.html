<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .link_color{
            color:white;
            text-decoration: none !important;
           }
           .sidebar ul li a:hover, .sidebar ul li.active { background: #2563eb; border-radius: 5px; }
        body {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            padding: 20px;
            position: fixed;
            height: 100%;
        }
        body { margin: 0; font-family: 'Poppins', sans-serif; display: flex; background: #f4f5f7; }
        .sidebar { width: 250px; background: #1e3a8a; color: white; height: 100vh; padding: 15px; position: fixed; }
        .sidebar h2 { text-align: center; font-weight: 600; margin-bottom: 20px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li a { padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .sidebar ul li a:hover, .sidebar ul li.active { background: #2563eb; border-radius: 5px; }
        .main-content { margin-left: 270px; padding: 20px; flex: 1; }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar ul li a:hover, .sidebar ul li.active { background: #2563eb; border-radius: 5px; }
        .content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 20px;
        }
        
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>HRMS Admin</h2>
        <ul>
           
                    <li ><a href="{{ url_for('admin_dashboard') }}" class=link_color ><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="active"><a href="{{ url_for('employees') }}" class=link_color><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="{{ url_for('attendance') }}"class=link_color><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li><a href="{{ url_for('timesheet_approval') }}" class=link_color><i class="fas fa-clipboard-list"></i> Timesheet Approval</a></li>
                    <li><a href="{{ url_for('reports') }}" class=link_color><i class="fas fa-chart-bar"></i> Reports</a></li>
                    <li><a href="{{ url_for('settings') }}"class=link_color><i class="fas fa-cogs"></i> Settings</a></li>
                    <li><a href="{{ url_for('logout') }}" class=link_color><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
    <div class="content">
        <h2>Dashboard</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-primary text-white p-3">
                    <h5>Total Employees</h5>
                    <p>120</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white p-3">
                    <h5>Active Employees</h5>
                    <p>100</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger text-white p-3">
                    <h5>Pending Leaves</h5>
                    <p>5</p>
                </div>
            </div>
        </div>
        <h3 class="mt-4">Employee Performance</h3>
        <canvas id="performanceChart" width="400" height="200"></canvas>
    </div>
    <script>
        var ctx = document.getElementById('performanceChart').getContext('2d');
        var chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                datasets: [{
                    label: 'Performance Score',
                    data: [80, 85, 78, 90, 88],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                }]
            }
        });
    </script>
</body>
</html>
