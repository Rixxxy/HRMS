
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #002F6C, #0046A8);
        }
        .container {
            display: flex;
            width: 900px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.02);
        }
        .left-section {
            width: 60%;
            padding: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }
        .right-section {
            width: 40%;
            background: rgba(0, 70, 168, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }
        .right-section h2 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .right-section p {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .right-section a {
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 24px;
            border: 2px solid #FFD700;
            border-radius: 6px;
            transition: all 0.3s ease-in-out;
        }
        .right-section a:hover {
            background: #FFD700;
            color: #0046A8;
        }
        .login-header {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #0046A8;
            text-align: center;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 10px 0 5px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease-in-out;
        }
        input:focus, select:focus {
            border-color: #0046A8;
            outline: none;
            box-shadow: 0px 0px 8px rgba(0, 70, 168, 0.4);
        }
        .forgot-password {
            text-align: right;
            display: block;
            margin-bottom: 15px;
            color: #0046A8;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease-in-out;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0046A8, #002F6C);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 70, 168, 0.3);
        }
        .btn:hover {
            background: linear-gradient(90deg, #002F6C, #001F4D);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="login-header">Human Resource Management System</div>
            <form action="/login" method="post">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <label for="userType">Select User Type</label>
                <select id="userType" name="userType">
                    <option value="admin">Admin</option>
                    <option value="employee">Employee</option>
                </select>
                
                <a href="#" class="forgot-password">Forgot password?</a>
                
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
        <div class="right-section">
            <h2>New Here?</h2>
            <p>Create an account and manage your HR tasks easily.</p>
            <a href="{{ url_for('signup') }}">Sign Up</a>
        </div>
    </div>
</body>
</html>
